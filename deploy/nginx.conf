# Nginx reverse proxy for the Dilamme Job Scheduler.
# Place at /etc/nginx/sites-available/job-scheduler and symlink into sites-enabled.
# Replace YOUR_DOMAIN with your dynamic-DNS hostname (e.g. dilamme-jobs.duckdns.org).

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Certbot will add the 80->443 redirect + the ssl server block below.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # Managed by Certbot:
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Static frontend (built with: cd frontend && npm run build)
    root /var/www/job-scheduler/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> Express on :4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering and keep the connection open.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
